# THE OVERNIGHT FLEET (SPEC-213)
#
# This runs on GitHub's runners, so it runs with the Mac off, the laptop shut, and no
# Cowork session open. That distinction matters: subagents inside a Cowork session die
# the moment the session ends. Anything promised to run "overnight" has to live here.
#
# Every agent VERIFIES and REPORTS. None of them edits code unattended. Every serious
# outage on this project came from an unattended change that passed static checks — a
# blank homepage, a white /auth, every crawled row silently discarded. A wrong report
# costs a minute of reading. A wrong 4am edit costs a morning.
name: night-fleet

on:
  schedule:
    - cron: '0 * * * *'    # HOURLY (founder 2026-08-03: "need to expedite my fixes") — was every 3h
  workflow_dispatch:
  push:
    branches: [main]
    # SPEC-250 (founder 2026-08-03: "expediate their delivery to NOW... back to back"):
    # every merge to main re-fires the fleet, so a landed fix immediately triggers the
    # next verification + work pass — back-to-back instead of waiting for the hour.
    paths: ['agents/fleet.json', 'specs/**', 'scripts/**', 'src/**', 'supabase/**']

# One fleet at a time; later triggers queue instead of stampeding the runner pool.
concurrency:
  group: night-fleet
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one agent failing must never silence the other seven
      matrix:
        id: [payments, booking-loop, ops-dashboard, data-dashboard, ci-health, legal-copy, inbox, profile-ux, ig-verify]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --no-audit --no-fund
      - name: Verify — gates, wall, build
        run: node scripts/agent-report.mjs ${{ matrix.id }}

      # The thinking half. This is what makes a CI agent equivalent to a subagent: a model
      # call with a brief and a bounded set of files. Never fails the job — an agent that
      # cannot reach the API must REPORT that loudly, not take the fleet down with it.
      - name: Work — look for a real defect in its own files
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_SCAN_MODEL: claude-haiku-4-5-20251001
          AGENT_FIX_MODEL: claude-opus-5
          AGENT_CTX_CAP: '80000'
        run: node scripts/agent-work.mjs ${{ matrix.id }} || true

      # A kept fix becomes a PR on its own branch. Never a push to main, never auto-merge.
      # Live numbers land in the PRODUCT DB so /ops/agents needs no GitHub.
      - name: Publish this run to the dashboard
        if: always()
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/agent-publish.mjs ${{ matrix.id }}

      - name: Open a PR if this subagent kept a fix
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-pr.mjs ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.id }}
          path: reports/${{ matrix.id }}*
          retention-days: 14

  morning:
    needs: agent
    if: always()              # an agent that DID NOT RUN is the loudest line on the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: 'report-*', merge-multiple: true }
      - run: mkdir -p reports && cp -f dl/*.md dl/*.json reports/ 2>/dev/null || true
      - run: node scripts/morning-report.mjs
      - name: Publish to the night-report branch
        run: |
          set -uo pipefail
          git config user.email "t@cergio.ai"; git config user.name "Cergio Bot"
          git checkout --orphan night-report
          git rm -rf --cached . >/dev/null 2>&1 || true
          # Only the reports. A branch that also carries the code invites someone to
          # merge it by accident.
          git add -f MORNING-REPORT.md reports/
          git commit -q -m "night fleet $(date -u +%FT%TZ)" || exit 0
          git push -f origin night-report
      - uses: actions/upload-artifact@v4
        with: { name: MORNING-REPORT, path: MORNING-REPORT.md, retention-days: 30 }
