# SPEC-120 — one-shot setup + health check for the SEPARATE growth project.
# Manual only. Verifies the GROWTH_* secrets really work, applies the growth
# schema, and prints proof. Nothing here can touch the product database: the
# applier refuses to run if GROWTH_SUPABASE_URL points at the product ref.
name: Growth DB setup

permissions:
  contents: write

on:
  workflow_dispatch: {}
  # PUSH TRIGGER (SPEC-139). api.github.com is firewalled from the sandbox
  # (measured: HTTP 000), and the Chrome extension is not always attached, so
  # neither the API nor the Actions UI is reliably reachable off-Mac. Pushing IS
  # reachable — so bumping this one file dispatches the workflow. It is the only
  # off-Mac path that never depends on the founder's laptop being awake.
  push:
    branches: [main]
    paths: ['.github/growth-trigger.txt']

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # SPEC-151: mint both service-role keys from the access tokens we already
      # hold, and push GROWTH_* into the edge-function runtime. Removes the two
      # hand-pasted secrets that produced a missing key and a cross-pasted key.
      - name: Derive service keys + set edge secrets
        id: keys
        env:
          GROWTH_SUPABASE_URL: ${{ secrets.GROWTH_SUPABASE_URL }}
          GROWTH_ACCESS_TOKEN: ${{ secrets.GROWTH_ACCESS_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROWTH_SERVICE_ROLE_KEY: ${{ secrets.GROWTH_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node scripts/growth-keys.mjs

      - name: Verify the GROWTH secrets are present and distinct from the product
        id: verify
        continue-on-error: true
        env:
          GROWTH_SUPABASE_URL: ${{ secrets.GROWTH_SUPABASE_URL }}
          GROWTH_SERVICE_ROLE_KEY: ${{ env.GROWTH_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GROWTH_SUPABASE_URL:-}" ] || { echo "::error::GROWTH_SUPABASE_URL is empty"; exit 1; }
          [ -n "${GROWTH_SERVICE_ROLE_KEY:-}" ] || { echo "::error::GROWTH_SERVICE_ROLE_KEY is empty"; exit 1; }
          # SPEC-150: the two service keys are easy to cross-paste — doing so breaks
          # growth auth AND leaves the workers unauthorised, which is exactly what
          # happened. Report both prefixes so a swap is obvious at a glance.
          echo "growth key prefix : $(printf '%s' "$GROWTH_SERVICE_ROLE_KEY" | cut -c1-11)…"
          case "$GROWTH_SUPABASE_URL" in
            *vjmwnbftfquyquwaklue*) echo "::error::points at the PRODUCT project — that is the outage"; exit 1;;
            https://*.supabase.co*) echo "URL shape OK (host masked)";;
            *) echo "::error::GROWTH_SUPABASE_URL must look like https://<ref>.supabase.co"; exit 1;;
          esac
          echo "secret length check: ${#GROWTH_SERVICE_ROLE_KEY} chars"

      - name: Live auth check against the growth project
        id: auth
        continue-on-error: true
        env:
          GROWTH_SUPABASE_URL: ${{ secrets.GROWTH_SUPABASE_URL }}
          GROWTH_SERVICE_ROLE_KEY: ${{ env.GROWTH_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # SPEC-148: reduce to scheme://host — the secret carried a /rest/v1 path,
          # so every call became '…/rest/v1/rest/v1/' and returned 404.
          GROWTH_SUPABASE_URL="$(printf '%s' "$GROWTH_SUPABASE_URL" | tr -d '[:space:]')"
          GROWTH_SUPABASE_URL="$(printf '%s' "$GROWTH_SUPABASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          # SHAPE report — no secret revealed, but a malformed value is obvious.
          echo "url length: ${#GROWTH_SUPABASE_URL}"
          echo "url host  : $(printf '%s' "$GROWTH_SUPABASE_URL" | sed -E 's#^(https?://)([^.]{0,4})[^.]*#\1\2***#')"
          echo "ends with /rest or slash: $(printf '%s' "$GROWTH_SUPABASE_URL" | grep -cE '(/rest|/)$')"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $GROWTH_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $GROWTH_SERVICE_ROLE_KEY" \
            "$GROWTH_SUPABASE_URL/rest/v1/")
          echo "growth REST responded: HTTP $CODE"
          case "$CODE" in
            200) echo "credentials accepted";;
            404) echo "::error::REST returned 404 — the URL is malformed (trailing slash?). Treating as FAILURE."; exit 1;;
            401|403) echo "::error::growth key rejected (HTTP $CODE) — re-copy the secret key"; exit 1;;
            *) echo "::error::unexpected HTTP $CODE from the growth project"; exit 1;;
          esac

      - name: Apply the growth schema
        id: schema
        env:
          GROWTH_SUPABASE_URL: ${{ secrets.GROWTH_SUPABASE_URL }}
          GROWTH_SERVICE_ROLE_KEY: ${{ env.GROWTH_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The growth project sits under a SEPARATE Supabase account, so it needs
          # its own token. Optional: without it the step verifies the schema over
          # REST instead of running DDL.
          GROWTH_ACCESS_TOKEN: ${{ secrets.GROWTH_ACCESS_TOKEN }}
        continue-on-error: true
        run: node scripts/apply-growth-schema.mjs

      - name: SEED the growth crawl queue (idempotent)
        id: seed
        env:
          GROWTH_SUPABASE_URL: ${{ secrets.GROWTH_SUPABASE_URL }}
          GROWTH_SERVICE_ROLE_KEY: ${{ env.GROWTH_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node scripts/seed-growth-queue.mjs

      - name: KICK the workers (drain the freshly seeded queue)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          FN="https://vjmwnbftfquyquwaklue.functions.supabase.co"
          curl -s -o /dev/null -w 'supply-engine   -> HTTP %{http_code}\n' \
            -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$FN/supply-engine" --max-time 120 || true
          for i in 1 2 3 4 5 6; do
            curl -s -o /dev/null -w "fulfill-crawl#$i -> HTTP %{http_code}\n" \
              -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$FN/fulfill-crawl?limit=200" --max-time 120 &
          done
          wait
          # SPEC-150: SUPABASE_SERVICE_ROLE_KEY did not EXIST as a repo secret, so
          # every kick sent an empty Bearer and got 401 — for hours, silently. A
          # missing secret must be named immediately, not inferred from a 401.
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is EMPTY or missing. Add it as a repo secret (product project service_role key). Workers cannot be kicked without it."
            echo "SUPABASE_SERVICE_ROLE_KEY missing — workers not kicked" > /tmp/worker-probe.txt
            exit 0
          fi
          echo "product key length: ${#SUPABASE_SERVICE_ROLE_KEY} · prefix: $(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | cut -c1-11)…"

          # SPEC-149: capture the worker's actual RESPONSE BODY. Kicks were firing
          # and the queue stayed untouched, but I was only logging status codes to
          # a log I cannot read. growthDb() THROWS when the edge secret is missing
          # or malformed, which surfaces as a 500 with the reason in the body —
          # the single fact needed to tell "not deployed" from "secret wrong".
          echo "--- single probe with body ---" > /tmp/worker-probe.txt
          curl -s -w '\nHTTP %{http_code}\n' \
            -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$FN/fulfill-crawl?limit=3" --max-time 170 2>&1 | head -c 700 >> /tmp/worker-probe.txt
          cat /tmp/worker-probe.txt
          echo "workers dispatched — waiting 25s for rows to land"
          sleep 25

      - name: GROWTH STATUS — write the report INTO the repo
        # SPEC-141: ALWAYS. Earlier runs died before this step and committed
        # nothing, so from off-Mac (no api.github.com, no browser) the failure was
        # invisible — exactly the class of blindness that cost a day already. A
        # report that only appears on success is not observability.
        if: always()
        env:
          GROWTH_SUPABASE_URL: ${{ secrets.GROWTH_SUPABASE_URL }}
          GROWTH_SERVICE_ROLE_KEY: ${{ env.GROWTH_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          # SPEC-145: trim whitespace/newlines AND trailing slashes. A pasted
          # secret often carries a newline, which %/ does not remove.
          # SPEC-148: reduce to scheme://host — the secret carried a /rest/v1 path,
          # so every call became '…/rest/v1/rest/v1/' and returned 404.
          GROWTH_SUPABASE_URL="$(printf '%s' "$GROWTH_SUPABASE_URL" | tr -d '[:space:]')"
          GROWTH_SUPABASE_URL="$(printf '%s' "$GROWTH_SUPABASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          H_K="apikey: $GROWTH_SERVICE_ROLE_KEY"
          H_A="Authorization: Bearer $GROWTH_SERVICE_ROLE_KEY"
          cnt () {
            curl -s -I -H "$H_K" -H "$H_A" -H 'Prefer: count=exact' \
              "$GROWTH_SUPABASE_URL/rest/v1/$1?select=id&limit=1${2:-}" \
              | tr -d '\r' | sed -n 's/.*content-range: .*\///p'
          }
          # SPEC-140: the report is COMMITTED to the repo, not just printed. The
          # sandbox cannot reach api.github.com and the Chrome extension detaches,
          # so Actions logs are frequently unreadable off-Mac. git always works.
          OUT=GROWTH-STATUS.md
          {
            echo "# Growth status"
            echo
            echo "steps — verify: ${{ steps.verify.outcome }} · auth: ${{ steps.auth.outcome }} · schema: ${{ steps.schema.outcome }} · seed: ${{ steps.seed.outcome }}"
            echo
            # SPEC-146: the URL's SHAPE, in the report itself. GitHub step logs are
            # not reachable from the sandbox, so a diagnostic that only lands in a
            # log is a diagnostic I cannot read. Nothing secret is revealed — just
            # length, scheme, host suffix and a probe status.
            echo '## connection shape'
            echo
            echo "- url length: ${#GROWTH_SUPABASE_URL}"
            echo "- scheme ok (https://): $(printf '%s' "$GROWTH_SUPABASE_URL" | grep -c '^https://')"
            echo "- ends .supabase.co: $(printf '%s' "$GROWTH_SUPABASE_URL" | grep -c '\.supabase\.co$')"
            echo "- contains /dashboard/: $(printf '%s' "$GROWTH_SUPABASE_URL" | grep -c '/dashboard/')"
            echo "- key length: ${#GROWTH_SERVICE_ROLE_KEY}"
            echo "- key prefix: $(printf '%s' "$GROWTH_SERVICE_ROLE_KEY" | cut -c1-11)…"
            PROBE=$(curl -s -o /dev/null -w '%{http_code}' -H "$H_K" -H "$H_A" "$GROWTH_SUPABASE_URL/rest/v1/")
            echo "- GET /rest/v1/ -> HTTP $PROBE"
            echo
            echo
            echo "generated: $(date -u +%FT%TZ)"
            echo
            echo '| table | rows |'
            echo '|---|---|'
            echo "| leads_services | $(cnt leads_services) |"
            echo "| leads_influencers | $(cnt leads_influencers) |"
            echo "| crawl_requests | $(cnt crawl_requests) |"
            echo "| &nbsp;&nbsp;new | $(cnt crawl_requests '&status=eq.new') |"
            echo "| &nbsp;&nbsp;crawling | $(cnt crawl_requests '&status=eq.crawling') |"
            echo "| &nbsp;&nbsp;delivered | $(cnt crawl_requests '&status=eq.delivered') |"
            echo "| agent_runs | $(cnt agent_runs) |"
            echo
            echo '## rows by source'
            echo
            echo '| source | rows |'
            echo '|---|---|'
            for s in gmaps_apify craigslist yellowpages_apify yelp google_lsa google_sponsored osm ig_services; do
              echo "| $s | $(cnt leads_services "&data_source=eq.$s") |"
            done
            echo
            echo '## key derivation + edge secrets'
            echo
            echo '```'
            cat /tmp/growth-keys.txt 2>/dev/null || echo 'derive step produced no log'
            echo '```'
            echo
            echo '## worker probe (fulfill-crawl response)'
            echo
            echo '```'
            cat /tmp/worker-probe.txt 2>/dev/null || echo 'no probe captured'
            echo '```'
            echo
            echo '## last 10 agent runs (growth DB)'
            echo
            echo '```json'
            curl -s -H "$H_K" -H "$H_A" \
              "$GROWTH_SUPABASE_URL/rest/v1/agent_runs?select=agent,status,started_at,rows_written&order=started_at.desc&limit=10"
            echo
            echo '```'
          } > "$OUT"
          cat "$OUT"

      - name: Publish the report to the growth-status branch
        if: always()
        run: |
          set -uo pipefail
          # SPEC-142: main is branch-protected (PR + required checks), so the
          # earlier `git push origin HEAD:main` was REJECTED and the `|| echo`
          # swallowed it — which is why two runs produced no report and the
          # failure stayed invisible. Publish to an UNPROTECTED orphan branch
          # instead; `git fetch origin growth-status` reads it from anywhere,
          # with no API and no browser.
          git config user.name  "cergio-growth[bot]"
          git config user.email "growth@cergio.ai"
          TMP=$(mktemp -d)
          cp GROWTH-STATUS.md "$TMP/GROWTH-STATUS.md" 2>/dev/null || echo "report missing" > "$TMP/GROWTH-STATUS.md"
          cd "$TMP"
          git init -q .
          git checkout -q -b growth-status
          git add GROWTH-STATUS.md
          git -c user.name="cergio-growth[bot]" -c user.email="growth@cergio.ai" \
            commit -q -m "growth status $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            growth-status
          echo "published to the growth-status branch"
