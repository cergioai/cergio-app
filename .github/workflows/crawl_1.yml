name: Cergio crawl

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "ig, realestate, localbiz"
        default: "ig,realestate,localbiz"
      shards:
        description: "parallel jobs (1-20). 4 is the safe default — 14 triggers SerpApi 429s."
        default: "4"
      paid_searches:
        description: "HARD CAP on paid searches per shard. 0 = free sources only."
        default: "0"
      audit_approved:
        description: "Set to yes ONLY after auditing the first 2,000 records. Releases the gate."
        default: "no"
  schedule:
    # Hourly: FREE OpenStreetMap discovery only. Zero paid calls, ever.
    - cron: "0 * * * *"
    # Once a day at 06:00 UTC: one small, hard-capped paid pass for the
    # Instagram/creator half that OSM cannot reach. 4 shards x 7 searches
    # = 28/day = ~840/month, inside the $25 Starter plan's 1,000.
    - cron: "0 6 * * *"

# pull-requests: write is required for the publish fallback below.
permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------- SETUP --
  # The `shards` input used to be decorative: the matrix was hardcoded [0..13]
  # and the script got a literal `--of 14`, so a dispatch could only ever run
  # all 14. Now the input actually builds the matrix, which makes a small
  # smoke-test run possible.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
      cap: ${{ steps.m.outputs.cap }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          # 14 shards x 24 workers = ~336 concurrent SerpApi callers, which the
          # API answered with 5,045 consecutive HTTP 429s and zero results.
          # Discovery is rate-limited; only FETCHING parallelises for free.
          N="${{ inputs.shards || '4' }}"
          case "$N" in ''|*[!0-9]*) N=4 ;; esac
          if [ "$N" -lt 1 ] || [ "$N" -gt 20 ]; then N=4; fi

          # THE BUDGET DECISION, made in one place.
          # Hourly cron and manual runs: 0 paid searches unless asked for.
          # The 06:00 cron: 7 per shard. Nothing else can spend.
          CAP="${{ inputs.paid_searches || '0' }}"
          case "$CAP" in ''|*[!0-9]*) CAP=0 ;; esac
          if [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then CAP=7; fi
          if [ "$CAP" -gt 400 ]; then CAP=400; fi

          # ---------------------------------------------------- AUDIT GATE --
          # Founder decision, 2026-08-19: stop and audit at 2,000 records before
          # spending anything on the run to 15,000. Until audit_approved=yes,
          # a published count at or above 2,000 forces every paid budget to 0.
          # Free OpenStreetMap discovery is unaffected and keeps running.
          HAVE=0
          if [ -f public/crawl-status.json ]; then
            HAVE=$(jq -r '.totals.crawled // 0' public/crawl-status.json)
          fi
          echo "published records so far: $HAVE"
          if [ "$HAVE" -ge 2000 ] && [ "${{ inputs.audit_approved || 'no' }}" != "yes" ]; then
            CAP=0
            echo "::warning::AUDIT GATE: $HAVE records published (>= 2000). Paid \
          discovery is frozen until the data is audited. Re-run with \
          audit_approved=yes to release it."
            echo "### AUDIT GATE ACTIVE" >> $GITHUB_STEP_SUMMARY
            echo "$HAVE records published. Paid discovery frozen at 0 pending your audit." \
              >> $GITHUB_STEP_SUMMARY
            echo "Free OpenStreetMap discovery continues. Re-run with audit_approved=yes to resume." \
              >> $GITHUB_STEP_SUMMARY
          fi

          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> $GITHUB_OUTPUT
          echo "count=$N" >> $GITHUB_OUTPUT
          echo "cap=$CAP" >> $GITHUB_OUTPUT
          echo "running $N shards | paid-search cap per shard: $CAP"
          echo "$N shards · paid cap $CAP/shard (max $((N * CAP)) searches this run)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------- CRAWL --
  # N jobs in parallel, each taking every Nth neighbourhood. Same grid,
  # an Nth of the wall clock, and no two shards touch the same business.
  crawl:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/cache/restore@v4
        with:
          path: |
            tools/crawl/raw
            tools/crawl/candidates
          key: shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: shard-${{ matrix.shard }}-

      # FREE DISCOVERY FIRST. OpenStreetMap: no key, no quota, no bill.
      # This is what keeps the crawler alive when the paid budget is 0.
      - name: Free discovery (OpenStreetMap)
        continue-on-error: true
        run: |
          cd tools/crawl
          python3 osm_discover.py \
            --cities NYC,MIA \
            --shard ${{ matrix.shard }} --of ${{ needs.setup.outputs.count }} \
            --max-queries 60

      - name: Crawl shard ${{ matrix.shard }}
        env:
          # Whichever key exists wins; overnight.py prefers Serper because it is
          # ~80x cheaper per search than SerpApi for identical results.
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          cd tools/crawl
          python3 overnight.py \
            --cities NYC,MIA \
            --sources "${{ inputs.sources || 'ig,realestate,localbiz' }}" \
            --shard ${{ matrix.shard }} --of ${{ needs.setup.outputs.count }} \
            --max-searches ${{ needs.setup.outputs.cap }} \
            --target 15000 --hours 0.9 --workers 24

      # Proof the shard actually produced something, in the job log where it
      # can be seen without unzipping an artifact.
      - name: Shard ${{ matrix.shard }} yield
        if: always()
        run: |
          cd tools/crawl
          echo "shard ${{ matrix.shard }}: raw=$(ls raw 2>/dev/null | wc -l) candidates=$(ls candidates 2>/dev/null | wc -l)"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            tools/crawl/raw
            tools/crawl/candidates
          key: shard-${{ matrix.shard }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            tools/crawl/raw
            tools/crawl/candidates
          retention-days: 3

  # --------------------------------------------------------------- MERGE --
  # Pulls every shard together, extracts once, gates once, publishes once.
  merge:
    needs: [setup, crawl]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet openpyxl

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/shards

      # THE COMBINE USED TO FAIL SILENTLY. `cp -rn ... 2>/dev/null || true`
      # swallowed everything, so a bad glob produced an empty directory, the
      # extractor ran on nothing, and the run went green with zero rows.
      # Now it counts what landed and stops the job if nothing did.
      - name: Combine every shard
        run: |
          cd tools/crawl && mkdir -p raw candidates
          cp -rn /tmp/shards/*/raw/*        raw/        2>/dev/null || true
          cp -rn /tmp/shards/*/candidates/* candidates/ 2>/dev/null || true
          RAW=$(ls raw | wc -l)
          CAND=$(ls candidates | grep -cv '^_' || true)   # exclude _searched.json
          echo "raw=$RAW  candidates=$CAND"
          echo "combined: $RAW raw artifacts, $CAND candidates" >> $GITHUB_STEP_SUMMARY
          if [ "$CAND" -lt 1 ]; then
            echo "::error::No candidates from any shard. Every shard failed, or the artifact paths moved."
            exit 1
          fi

      - name: Extract
        run: cd tools/crawl && python3 extract.py

      # A zero-row extract must never reach publish. Publishing crawled:0 over
      # a good previous run is worse than not publishing at all.
      - name: Guard against an empty extract
        run: |
          cd tools/crawl
          N=$(python3 -c "import json;print(len(json.load(open('out/records.json'))))")
          echo "extracted $N records"
          if [ "$N" -lt 1 ]; then
            echo "::error::extract.py produced 0 records — refusing to publish."
            exit 1
          fi

      # Never blocks a drop, but never silent either. Counts non-null follower
      # values before and after, and says plainly if the pass filled nothing.
      - name: Follower counts (Bright Data)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        continue-on-error: true
        run: |
          cd tools/crawl
          BEFORE=$(jq '[.[] | select(.followers != null)] | length' out/records.json)
          CREATORS=$(jq '[.[] | select(.audience == "creator")] | length' out/records.json)
          if [ -z "${BRIGHTDATA_API_KEY}" ]; then
            echo "::warning::BRIGHTDATA_API_KEY is not set — follower counts will stay NULL."
            echo "- followers: SKIPPED, no BRIGHTDATA_API_KEY" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          python3 cergio_pipeline.py followers || echo "::warning::follower pass exited non-zero"
          python3 extract.py
          AFTER=$(jq '[.[] | select(.followers != null)] | length' out/records.json)
          echo "followers: $BEFORE -> $AFTER of $CREATORS creators"
          echo "- followers filled: **$AFTER / $CREATORS creators** (was $BEFORE)" >> $GITHUB_STEP_SUMMARY
          if [ "$AFTER" -le "$BEFORE" ]; then
            echo "::warning::Follower pass filled ZERO new counts. Creator quality \
          gating cannot work until this is fixed — check the Bright Data key and quota."
            echo "- :warning: follower pass filled nothing — creator filtering is blind" \
              >> $GITHUB_STEP_SUMMARY
          fi

      # THE GATE. Never add continue-on-error here.
      - name: Quality gate
        run: cd tools/crawl && python3 qa.py

      # The independent re-derivation. It is what actually caught the fake area
      # codes and the mailto leak, and it was never wired into CI. Reporting
      # only for now so it cannot block a drop; read it in the summary.
      - name: Independent audit (report only)
        continue-on-error: true
        run: |
          cd tools/crawl
          echo '### Independent audit' >> $GITHUB_STEP_SUMMARY
          python3 audit.py | tee -a $GITHUB_STEP_SUMMARY

      - name: Build and publish
        run: |
          cd tools/crawl
          python3 build_xlsx.py
          python3 build_dashboard.py
          python3 publish.py

      # PUBLISHING NO LONGER DEPENDS ON PUSHING TO main.
      # The old step ended in `git push || echo "push blocked"`, which turned a
      # rejected push into a green tick and an unchanged site. If the direct
      # push is refused for any reason, this opens a pull request instead, so
      # the result is always visible somewhere.
      - name: Publish results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "cergio-crawler"
          git config user.email "crawler@cergio.ai"
          git add -f public/leads.html public/leads.csv public/crawl-status.json
          if git diff --staged --quiet; then
            echo "no change to publish" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git commit -m "crawl: run ${{ github.run_number }} [skip ci]"
          git pull --rebase --autostash origin main || true
          if git push origin HEAD:main 2>push.log; then
            echo "published straight to main" >> $GITHUB_STEP_SUMMARY
          else
            echo "direct push refused — opening a pull request instead"
            cat push.log || true
            BR="crawl-results-${{ github.run_number }}"
            git push -f origin HEAD:refs/heads/$BR
            gh pr create --base main --head "$BR" \
              --title "crawl: run ${{ github.run_number }} results" \
              --body "Automated crawl output. Merge to publish to the site." \
              >> $GITHUB_STEP_SUMMARY 2>&1 \
              || echo "PR already open for $BR" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Could not push to main. Results are on branch $BR and a PR is open."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leads-${{ github.run_number }}
          path: |
            tools/crawl/out/*.xlsx
            tools/crawl/out/cergio-dashboard.html
            tools/crawl/out/records.json

      # NOTE: this step used to embed multi-line Python starting at column 0
      # inside a `run: |` block. That ends the YAML block scalar early and makes
      # the WHOLE FILE unparseable — which is why this workflow never appeared
      # in the Actions tab and never ran. Shell and jq only from here.
      - name: Summary
        if: always()
        run: |
          P=public/crawl-status.json
          if [ -f "$P" ]; then
            {
              echo "## $(jq -r '.totals.crawled' "$P") crawled · $(jq -r '.totals.contactable' "$P") contactable"
              echo "- $(jq -r '.totals.with_email' "$P") email · $(jq -r '.totals.with_phone' "$P") phone · $(jq -r '.totals.with_instagram' "$P") Instagram"
              echo "- NYC $(jq -r '.by_city.NYC' "$P") · Miami $(jq -r '.by_city.MIA' "$P")"
              jq -r '.by_source | to_entries[] | "- **\(.key)**: \(.value.total) (\(.value.contactable) contactable)"' "$P"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "## No crawl-status.json was produced — the run did not reach publish." >> $GITHUB_STEP_SUMMARY
          fi
