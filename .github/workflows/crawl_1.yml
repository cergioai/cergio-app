name: Cergio crawl

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "NYC, MIA, or NYC,MIA"
        default: "NYC,MIA"
      target:
        description: "leads to aim for"
        default: "15000"
      hours:
        description: "how long to run"
        default: "0.8"
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: cergio-crawl

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl

      - uses: actions/cache/restore@v4
        with:
          path: |
            tools/crawl/raw
            tools/crawl/candidates
          key: cergio-${{ github.run_id }}
          restore-keys: cergio-

      - name: Crawl
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          cd tools/crawl
          python3 overnight.py \
            --cities "${{ inputs.cities || 'NYC,MIA' }}" \
            --target "${{ inputs.target || '15000' }}" \
            --hours "${{ inputs.hours || '0.8' }}" \
            --workers 8

      - name: Extract
        run: cd tools/crawl && python3 extract.py

      - name: Follower counts
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        continue-on-error: true
        run: |
          cd tools/crawl
          python3 cergio_pipeline.py followers
          python3 extract.py

      - name: Quality gate
        run: cd tools/crawl && python3 qa.py

      - name: Spreadsheet
        run: cd tools/crawl && python3 build_xlsx.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            tools/crawl/raw
            tools/crawl/candidates
          key: cergio-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leads-${{ github.run_number }}
