# Off-Mac Supabase edge-function deploy.
#
# WHY: deploying edge functions used to require the Mac (supabase CLI + login).
# This runs the SAME deploy in GitHub CI on every push to main that touches an
# edge function or a migration, so shipping a function never needs the laptop.
#
# ONE HUMAN STEP (once): add a repo secret SUPABASE_ACCESS_TOKEN
#   GitHub → repo Settings → Secrets and variables → Actions → New repository secret
#   Name: SUPABASE_ACCESS_TOKEN
#   Value: a Supabase personal access token (Supabase dashboard → Account → Access Tokens)
# After that, every push that changes supabase/functions/** deploys automatically.
#
# NO SECRET VALUE LIVES IN THIS FILE — only the ${{ secrets.* }} reference.
#
# MIGRATIONS: this workflow deploys FUNCTIONS only. Schema migrations under
# supabase/migrations/** still need to be applied separately (run the migration
# .command on the Mac, or `supabase db push` with the DB password). We do NOT run
# `db push` here on purpose: it needs the database password (a second secret) and
# an unreviewed auto-migrate on every push is riskier than a function deploy.
# Leave migrations MANUAL for now.
name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'   # trigger a run so the log reminds us to apply migrations
  workflow_dispatch: {}            # allow a manual run from the Actions tab

# Project ref is public (it's in every function URL); only the access token is secret.
env:
  SUPABASE_PROJECT_REF: vjmwnbftfquyquwaklue

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions (--no-verify-jwt)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="$SUPABASE_PROJECT_REF"
          # Full function set (from supabase/functions/). --no-verify-jwt because
          # these are called by cron/webhooks/service-role, not end-user JWTs.
          # AUTO-DISCOVER every function directory (SPEC-104b, 2026-07-29).
          # The hard-coded list fell 11 functions behind the repo, so new functions
          # 404'd in prod while the code read as shipped — and one that HAD been
          # deployed manually then served a STALE 200 forever, which no error-path
          # fallback can detect. Discovery removes the whole failure class.
          # Skips _shared/ and other _-prefixed dirs (modules, not functions).
          mapfile -t FUNCS < <(find supabase/functions -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep -v '^_' | sort)
          echo "discovered ${#FUNCS[@]} functions: ${FUNCS[*]}"
          for fn in "${FUNCS[@]}"; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$REF" --no-verify-jwt
            echo "::endgroup::"
          done

      - name: Apply pending migrations (Management API — no DB password needed)
        env:
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # THE LAST MAC DEPENDENCY. This workflow used to deploy functions and then
          # merely PRINT a reminder that migrations still needed a laptop, so pg_cron
          # schedules and schema changes rotted for weeks. The Management API takes
          # SQL with the access token CI already holds, so no DB password is involved.
          # scripts/apply-migrations.mjs tracks what it has applied, runs each file
          # once in filename order, stops on the first failure, and refuses any
          # unscoped destructive statement.
          node scripts/apply-migrations.mjs
